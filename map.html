<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSA Proje - Dünya Haritası</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="menuBtn" aria-label="Menu">
  <img class="logo-dark"  src="images/menu.jpeg"       alt="☰">
  <img class="logo-light" src="images/menu.light.jpeg" alt="☰">
</button>
    <div>
      <h1>Analog Earth</h1>
      <p class="hint">Photo 1 is from Earth, 2 is from Mars/Moon</p>
    </div>
  </header>

  <div id="wrap">
    <svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="none"></svg>
    <div id="selection"></div>
    <div id="popup" hidden></div>
  </div>

  <!-- Sağ alt kontroller -->
<div id="controls">
  <button id="fsBtn" title="Full screen" aria-label="Full screen">
    <svg class="ic-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg class="ic-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
  </button>
  <span class="sep"></span>
  <button id="zoomIn" title="Zoom in" aria-label="Zoom in">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button id="zoomOut" title="Zoom out" aria-label="Zoom out">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
  </button>
</div>

<!-- Light / Dark switch -->
<button id="themeSwitch" role="switch" aria-checked="false" aria-label="Light mode" title="Light mode">
  <span class="knob">
    <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </span>
</button>

<!-- A Projesi'ne dön -->
<a id="closeMap" href="index.html" title="Close" aria-label="Close map">
  <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<!-- Yan panel -->
  <div id="overlay"></div>
  <aside id="panel">
    <div class="panel-head">
      <span>Menu</span>
      <button id="panelClose" class="x-btn" aria-label="Close">×</button>
    </div>
    <div id="panelList"></div>
  </aside>

  <!-- Düğmelere tıklayınca açılan ekran -->
  <div id="modal">
    <div class="modal-box">
      <button id="modalClose" class="x-btn" aria-label="Close">×</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="world.js"></script>
<script src="continents.js"></script>
<script src="points.js"></script>
<script src="texts.js"></script>
<script src="script.js"></script>
<script src="menu.js"></script>
<script src="filozoflar_nasa_asistan.js"></script>
</body>
</html>
